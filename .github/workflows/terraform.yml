name: 'Terraform CI/CD (Manual Execution)'

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Select the Terraform layer to execute'
        required: true
        type: choice
        options:
          - org
          - projects
          - networking
          - iam
      action:
        description: 'Select the action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: 'projects/1040065388093/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'sa-terraform-deploy@prj-sh-cicd-499518.iam.gserviceaccount.com'

jobs:
  # ==========================================
  # 1. ORG
  # ==========================================
  org_plan:
    name: 'Plan: org'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.layer == 'org' && github.event.inputs.action == 'plan' }}
    defaults:
      run:
        working-directory: live/org
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  org_apply:
    name: 'Apply: org'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.layer == 'org' && github.event.inputs.action == 'apply' }}
    environment: org-env
    defaults:
      run:
        working-directory: live/org
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false

  # ==========================================
  # 2. PROJECTS
  # ==========================================
  projects_plan:
    name: 'Plan: projects'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.layer == 'projects' && github.event.inputs.action == 'plan' }}
    defaults:
      run:
        working-directory: live/projects
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  projects_apply:
    name: 'Apply: projects'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.layer == 'projects' && github.event.inputs.action == 'apply' }}
    environment: projects-env
    defaults:
      run:
        working-directory: live/projects
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false

  # ==========================================
  # 3. NETWORKING
  # ==========================================
  networking_plan:
    name: 'Plan: networking'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.layer == 'networking' && github.event.inputs.action == 'plan' }}
    defaults:
      run:
        working-directory: live/networking
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  networking_apply:
    name: 'Apply: networking'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.layer == 'networking' && github.event.inputs.action == 'apply' }}
    environment: networking-env
    defaults:
      run:
        working-directory: live/networking
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false

  # ==========================================
  # 4. IAM
  # ==========================================
  iam_plan:
    name: 'Plan: iam'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.layer == 'iam' && github.event.inputs.action == 'plan' }}
    defaults:
      run:
        working-directory: live/iam
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  iam_apply:
    name: 'Apply: iam'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.layer == 'iam' && github.event.inputs.action == 'apply' }}
    environment: iam-env
    defaults:
      run:
        working-directory: live/iam
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false
