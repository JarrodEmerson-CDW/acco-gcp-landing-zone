name: 'Terraform CI/CD (Manual Approvals)'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: 'projects/1040065388093/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'sa-terraform-deploy@prj-sh-cicd-499518.iam.gserviceaccount.com'

jobs:
  # ==========================================
  # 1. BOOTSTRAP
  # ==========================================
  bootstrap_plan:
    name: 'Plan: bootstrap'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live/bootstrap
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  bootstrap_apply:
    name: 'Apply: bootstrap'
    runs-on: ubuntu-latest
    needs: bootstrap_plan
    environment: bootstrap-env # <--- This pauses the pipeline for approval
    defaults:
      run:
        working-directory: live/bootstrap
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false

  # ==========================================
  # 2. ORG
  # ==========================================
  org_plan:
    name: 'Plan: org'
    runs-on: ubuntu-latest
    needs: bootstrap_apply
    defaults:
      run:
        working-directory: live/org
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  org_apply:
    name: 'Apply: org'
    runs-on: ubuntu-latest
    needs: org_plan
    environment: org-env
    defaults:
      run:
        working-directory: live/org
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false

  # ==========================================
  # 3. PROJECTS
  # ==========================================
  projects_plan:
    name: 'Plan: projects'
    runs-on: ubuntu-latest
    needs: org_apply
    defaults:
      run:
        working-directory: live/projects
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  projects_apply:
    name: 'Apply: projects'
    runs-on: ubuntu-latest
    needs: projects_plan
    environment: projects-env
    defaults:
      run:
        working-directory: live/projects
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false

  # ==========================================
  # 4. NETWORKING
  # ==========================================
  networking_plan:
    name: 'Plan: networking'
    runs-on: ubuntu-latest
    needs: projects_apply
    defaults:
      run:
        working-directory: live/networking
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  networking_apply:
    name: 'Apply: networking'
    runs-on: ubuntu-latest
    needs: networking_plan
    environment: networking-env
    defaults:
      run:
        working-directory: live/networking
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false

  # ==========================================
  # 5. IAM
  # ==========================================
  iam_plan:
    name: 'Plan: iam'
    runs-on: ubuntu-latest
    needs: networking_apply
    defaults:
      run:
        working-directory: live/iam
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - run: terraform plan -no-color

  iam_apply:
    name: 'Apply: iam'
    runs-on: ubuntu-latest
    needs: iam_plan
    environment: iam-env
    defaults:
      run:
        working-directory: live/iam
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false
