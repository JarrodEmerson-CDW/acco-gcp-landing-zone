name: 'Terraform CI/CD (Push & Manual Execution)'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      layer:
        description: 'Select the Terraform layer to execute'
        required: true
        type: choice
        options:
          - org
          - projects
          - networking
          - iam
      action:
        description: 'Select the action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: 'projects/1040065388093/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'sa-terraform-deploy@prj-sh-cicd-499518.iam.gserviceaccount.com'

jobs:
  # ==========================================
  # 1. ORG
  # ==========================================
  org_plan:
    name: 'Plan: org'
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'org')"
    outputs:
      tf_exitcode: ${{ steps.tfplan.outputs.tf_exitcode }}
    defaults:
      run:
        working-directory: live/org
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - name: Terraform Plan
      id: tfplan
      run: |
        set +e
        terraform plan -no-color -var-file=../../terraform.tfvars -detailed-exitcode -input=false
        EXIT_CODE=$?
        echo "tf_exitcode=$EXIT_CODE" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
        exit 0

