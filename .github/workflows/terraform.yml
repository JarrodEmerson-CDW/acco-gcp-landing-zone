name: 'Terraform CI/CD (Sequential)'

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: 'projects/1040065388093/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'sa-terraform-deploy@prj-sh-cicd-499518.iam.gserviceaccount.com'

jobs:
  # 1. BOOTSTRAP
  bootstrap:
    name: 'TF: bootstrap'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live/bootstrap
    
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init
    - run: terraform fmt -check
    - if: github.event_name == 'pull_request'
      run: terraform plan -no-color
    - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

  # 2. ORG (Waits for bootstrap)
  org:
    name: 'TF: org'
    runs-on: ubuntu-latest
    needs: bootstrap
    defaults:
      run:
        working-directory: live/org
        
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init
    - run: terraform fmt -check
    - if: github.event_name == 'pull_request'
      run: terraform plan -no-color
    - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

  # 3. PROJECTS (Waits for org)
  projects:
    name: 'TF: projects'
    runs-on: ubuntu-latest
    needs: org
    defaults:
      run:
        working-directory: live/projects
        
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init
    - run: terraform fmt -check
    - if: github.event_name == 'pull_request'
      run: terraform plan -no-color
    - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

  # 4. NETWORKING (Waits for projects)
  networking:
    name: 'TF: networking'
    runs-on: ubuntu-latest
    needs: projects
    defaults:
      run:
        working-directory: live/networking
        
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init
    - run: terraform fmt -check
    - if: github.event_name == 'pull_request'
      run: terraform plan -no-color
    - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

  # 5. IAM (Waits for networking)
  iam:
    name: 'TF: iam'
    runs-on: ubuntu-latest
    needs: networking
    defaults:
      run:
        working-directory: live/iam
        
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init
    - run: terraform fmt -check
    - if: github.event_name == 'pull_request'
      run: terraform plan -no-color
    - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
