name: 'Terraform CI/CD (Push & Manual Execution)'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      layer:
        description: 'Select the Terraform layer to execute'
        required: true
        type: choice
        options:
          - org
          - projects
          - networking
          - iam
      action:
        description: 'Select the action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: 'projects/1040065388093/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'sa-terraform-deploy@prj-sh-cicd-499518.iam.gserviceaccount.com'

jobs:
  # ==========================================
  # 1. ORG
  # ==========================================
  org_plan:
    name: 'Plan: org'
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'org') }}
    outputs:
      tf_exitcode: ${{ steps.tfplan.outputs.tf_exitcode }}
    defaults:
      run:
        working-directory: live/org
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - name: Terraform Plan
      id: tfplan
      run: |
        set +e
        terraform plan -no-color -var-file=../../terraform.tfvars -detailed-exitcode -input=false
        EXIT_CODE=$?
        echo "tf_exitcode=$EXIT_CODE" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
        exit 0

  org_apply:
    name: 'Apply: org'
    runs-on: ubuntu-latest
    needs: org_plan
    if: ${{ success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'org' && inputs.action == 'apply')) && needs.org_plan.outputs.tf_exitcode == '2' }}
    environment: org-env
    defaults:
      run:
        working-directory: live/org
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false -var-file=../../terraform.tfvars

  # ==========================================
  # 2. PROJECTS
  # ==========================================
  projects_plan:
    name: 'Plan: projects'
    runs-on: ubuntu-latest
    needs: org_apply
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'projects')) }}
    outputs:
      tf_exitcode: ${{ steps.tfplan.outputs.tf_exitcode }}
    defaults:
      run:
        working-directory: live/projects
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - name: Terraform Plan
      id: tfplan
      run: |
        set +e
        terraform plan -no-color -var-file=../../terraform.tfvars -detailed-exitcode -input=false
        EXIT_CODE=$?
        echo "tf_exitcode=$EXIT_CODE" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
        exit 0

  projects_apply:
    name: 'Apply: projects'
    runs-on: ubuntu-latest
    needs: projects_plan
    if: ${{ success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'projects' && inputs.action == 'apply')) && needs.projects_plan.outputs.tf_exitcode == '2' }}
    environment: projects-env
    defaults:
      run:
        working-directory: live/projects
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false -var-file=../../terraform.tfvars

  # ==========================================
  # 3. NETWORKING
  # ==========================================
  networking_plan:
    name: 'Plan: networking'
    runs-on: ubuntu-latest
    needs: projects_apply
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'networking')) }}
    outputs:
      tf_exitcode: ${{ steps.tfplan.outputs.tf_exitcode }}
    defaults:
      run:
        working-directory: live/networking
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform fmt
    - name: Terraform Plan
      id: tfplan
      run: |
        set +e
        terraform plan -no-color -var-file=../../terraform.tfvars -detailed-exitcode -input=false
        EXIT_CODE=$?
        echo "tf_exitcode=$EXIT_CODE" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
        exit 0

  networking_apply:
    name: 'Apply: networking'
    runs-on: ubuntu-latest
    needs: networking_plan
    if: ${{ success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'networking' && inputs.action == 'apply')) && needs.networking_plan.outputs.tf_exitcode == '2' }}
    environment: networking-env
    defaults:
      run:
        working-directory: live/networking
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -reconfigure
    - run: terraform apply -auto-approve -input=false -var-file=../../terraform.tfvars

  # ==========================================
  # 4. IAM
  # ==========================================
  iam_plan:
    name: 'Plan: iam'
    runs-on: ubuntu-latest
    needs: networking_apply
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'iam')) }}
    outputs:
      tf_exitcode: ${{ steps.tfplan.outputs.tf_exitcode }}
    defaults:
      run:
        working-directory: live/iam
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service
